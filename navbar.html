<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>MUSIK</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="flagen.css">
    <link rel="stylesheet" href="frequenz.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js" type="text/javascript"></script>
    <script src="flagen.js"></script>
    <script src="index.js"></script>

</head>

<body>


    <nav class="navbar">
        <div class="navbar-brand" style="width: 100%; display: flex; justify-content: center; align-items: center;">
            <span id="inhaltverzeichnis_ein" data-key="music">Cours de musique</span>

        </div>

        <div class="navbar-menu">

            <div class="lang-dropdown-wrapper">
                <button id="lang-btn" class="theme-btn" type="button" aria-label="Sprache wählen">
                    <span id="current-flag">🇫🇷</span>
                </button>

                <div id="lang-menu" class="lang-dropdown-menu">
                    <button class="lang-option" data-lang="fr" data-flag="🇫🇷" type="button">
                        <span class="flag-icon">🇫🇷</span>
                        <span class="lang-text">Français</span>
                    </button>
                    <button class="lang-option" data-lang="de" data-flag="🇩🇪" type="button">
                        <span class="flag-icon">🇩🇪</span>
                        <span class="lang-text">Deutsch</span>
                    </button>
                    <button class="lang-option" data-lang="ar" data-flag="🇸🇦" type="button">
                        <span class="flag-icon">🇸🇦</span>
                        <span class="lang-text">العربية</span>
                    </button>
                </div>
            </div>


            <button id="print-btn" class="theme-btn" title="Aktuellen Abschnitt als PDF herunterladen">
                <span class="material-symbols-outlined">download</span>
            </button>

            <button id="theme-toggle" class="theme-btn" aria-label="Theme wechseln">
                <span class="material-symbols-outlined" id="theme-icon">light_mode</span>
            </button>
        </div>
    </nav>



</body>

</html>
