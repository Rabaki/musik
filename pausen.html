<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Pausenwerte</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/flagen.css">
    <link rel="stylesheet" href="css/frequenz.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js" type="text/javascript"></script>
    <script src="js/verzeichnis.js"></script>    
    <script src="js/languages.js"></script>
    <script src="js/theme-toggle.js"></script>
    <script src="js/noten.js"></script>
</head>
</head>

<body>

    <div id="navbar-placeholder"></div>

    <div class="noten-container" id="toc-container">
        <h2>Inhaltsverzeichnis</h2>
        <ul id="table-of-contents"></ul>
    </div>

    <div class="noten-container">
        <h2>Nom du silence (Pausenwerte)</h2>
        <table class="noten-tabelle">
            <thead>
                <tr>
                    <th>Symbole</th>
                    <th>Nom (Name)</th>
                    <th>Durée (Wert)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <!-- Ganze Pause -->
                    <td>
                        <div class="note-render" data-abc="X:1\nK:none\nz8"></div>
                    </td>
                    <td>Pause</td>
                    <td>4 temps (4 Schläge)</td>
                </tr>
                <tr>
                    <!-- Halbe Pause -->
                    <td>
                        <div class="note-render" data-abc="X:1\nK:none\nz4"></div>
                    </td>
                    <td> Demi-pause</td>
                    <td>2 temps (2 Schläge)</td>
                </tr>
                <tr>
                    <!-- Viertelpause -->
                    <td>
                        <div class="note-render" data-abc="X:1\nK:none\nz2"></div>
                    </td>
                    <td>Soupir</td>
                    <td>1 temps (1 Schlag)</td>
                </tr>
                <tr>
                    <!-- Achtelpause -->
                    <td>
                        <div class="note-render" data-abc="X:1\nK:none\nz"></div>
                    </td>
                    <td>Demi-soupir</td>
                    <td>1/2 temps (1/2 Schlag)</td>
                </tr>
                <tr>
                    <!-- Sechzehntelpause -->
                    <td>
                        <div class="note-render" data-abc="X:1\nK:none\nz/"></div>
                    </td>
                    <td>Quart de soupir</td>
                    <td>1/4 temps (1/4 Schlag)</td>
                </tr>
            </tbody>
        </table>
    </div>




   

</body>

</html>
